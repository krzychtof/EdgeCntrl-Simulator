frr version 10.2
frr defaults traditional
hostname core-south
log stdout
service integrated-vtysh-config
!
interface eth1
 ip address 10.0.13.2/30
!
interface eth2
 ip address 10.0.34.1/30
!
router bgp 64514
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 neighbor 10.0.13.1 remote-as 64512
 neighbor 10.0.34.2 remote-as 64515
!
