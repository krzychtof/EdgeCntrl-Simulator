frr version 10.2
frr defaults traditional
hostname edge-west
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.1/32
!
interface eth1
 ip address 10.0.12.1/30
!
interface eth2
 ip address 10.0.13.1/30
!
router bgp 64512
 bgp router-id 10.255.0.1
 no bgp ebgp-requires-policy
 neighbor 10.0.12.2 remote-as 64513
 neighbor 10.0.13.2 remote-as 64514
 neighbor 10.0.12.2 route-map PREFER-NORTH in
 neighbor 10.0.13.2 route-map PREFER-SOUTH in
 network 10.10.0.0/24
 network 10.255.0.1/32
!
route-map PREFER-NORTH permit 10
 set local-preference 200
!
route-map PREFER-SOUTH permit 10
 set local-preference 100
!
