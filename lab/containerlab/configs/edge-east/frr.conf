frr version 10.2
frr defaults traditional
hostname edge-east
log stdout
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.4/32
!
interface eth1
 ip address 10.0.24.2/30
!
interface eth2
 ip address 10.0.34.2/30
!
router bgp 64515
 bgp router-id 10.255.0.4
 no bgp ebgp-requires-policy
 neighbor 10.0.24.1 remote-as 64513
 neighbor 10.0.34.1 remote-as 64514
 neighbor 10.0.24.1 route-map PREFER-NORTH in
 neighbor 10.0.34.1 route-map PREFER-SOUTH in
 network 10.20.0.0/24
 network 10.255.0.4/32
!
route-map PREFER-NORTH permit 10
 set local-preference 200
!
route-map PREFER-SOUTH permit 10
 set local-preference 100
!
